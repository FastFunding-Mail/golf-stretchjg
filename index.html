<!DOCTYPE html>
<html lang="en">

<title>Golf Stretch</title>
<style>
  :root {
    --bg: #F4F2EC;
    --surface: #FFFFFF;
    --ink: #15201A;
    --muted: #68716A;
    --line: #E3DFD4;
    --primary: #143326;
    --primary-2: #1F4A37;
    --primary-soft: #E6EEE8;
    --accent-text: #1F4A37;
    --gold: #C9A227;
    --gold-soft: #F6EED3;
    --gold-text: #8A6D12;
    --on-primary: #F3EFE4;
    --on-primary-muted: rgba(243, 239, 228, 0.68);
    --shadow: 0 1px 2px rgba(20, 32, 26, 0.04), 0 4px 14px rgba(20, 32, 26, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1712;
      --surface: #18221C;
      --ink: #ECEAE3;
      --muted: #9AA39C;
      --line: #263229;
      --primary: #0B1F16;
      --primary-2: #2E6A4F;
      --primary-soft: #1F3328;
      --accent-text: #A9CDB8;
      --gold: #D9B440;
      --gold-soft: #2E2814;
      --gold-text: #D9B440;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .hero {
    background: var(--primary);
    color: var(--on-primary);
    padding: calc(22px + env(safe-area-inset-top)) 20px 18px;
  }
  .hero-inner { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .hero-mark {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: rgba(243, 239, 228, 0.08);
    border: 1px solid rgba(243, 239, 228, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 3px;
  }
  .hero h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
  }
  .hero-date { font-size: 13px; color: var(--on-primary-muted); margin: 3px 0 0; }

  /* Day picker */
  .tabs-wrap {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--primary);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
  }
  .tabs {
    display: flex;
    gap: 5px;
    max-width: 520px;
    margin: 0 auto;
    padding: 4px 16px 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1 1 0;
    min-width: 0;
    text-align: center;
    padding: 8px 4px 7px;
    border-radius: 10px;
    background: rgba(243, 239, 228, 0.07);
    color: var(--on-primary-muted);
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab-day { display: block; font-size: 13px; font-weight: 600; }
  .tab-focus { display: block; font-size: 10.5px; margin-top: 1px; opacity: 0.85; white-space: nowrap; }
  .tab.active { background: #F3EFE4; color: #143326; }
  .tab.today::after {
    content: "";
    position: absolute;
    top: 5px;
    right: 5px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
  }

  main {
    padding: 18px 16px calc(48px + env(safe-area-inset-bottom));
    max-width: 520px;
    margin: 0 auto;
  }

  /* Session summary */
  .summary {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }
  .session-title {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin: 0 0 4px;
  }
  .session-sub { font-size: 14px; color: var(--muted); margin: 0 0 14px; line-height: 1.45; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--primary-soft);
    border-radius: 999px;
    padding: 5px 10px;
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .progress-row strong { color: var(--ink); font-weight: 600; }
  .progress-track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: var(--primary-2);
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .summary.complete .progress-fill { background: var(--gold); }

  /* Exercise list */
  .section-head {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 4px 8px;
  }
  .list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 14px 14px 16px;
    border-top: 1px solid var(--line);
    cursor: pointer;
  }
  .row:first-child { border-top: none; }
  .check {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .row:hover .check { border-color: var(--primary-2); }
  .row.done .check { background: var(--primary-2); border-color: var(--primary-2); }
  .check svg { opacity: 0; transition: opacity 0.15s ease; }
  .row.done .check svg { opacity: 1; }
  .row-body { flex: 1; min-width: 0; }
  .ex-name {
    font-size: 15.5px;
    font-weight: 600;
    margin: 0;
    line-height: 1.3;
  }
  .row.done .ex-name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .badge {
    display: inline-block;
    vertical-align: 2px;
    margin-left: 6px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold-text);
    background: var(--gold-soft);
    border-radius: 4px;
    padding: 2px 5px;
  }
  .ex-detail { font-size: 13.5px; color: var(--muted); margin: 3px 0 0; }
  .ex-cue { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; font-style: italic; }
  .demo {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--primary-soft);
    color: var(--accent-text);
    text-decoration: none;
  }
  .demo:active { transform: scale(0.94); }

  /* Coach note */
  .note {
    margin-top: 22px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
  }
  .note-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
  }
  .footer button {
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    padding: 6px 12px;
    cursor: pointer;
  }
</style>
</head>

      { id: "tu1", name: "Cat-cow", detail: "10 reps", section: "Warm-up", video: YT("cat cow stretch tutorial") },
      { id: "tu2", name: "World's greatest stretch", detail: "5 each side", section: "Warm-up", video: YT("worlds greatest stretch tutorial") },

      { id: "we7", name: "Foam roll: quads, glutes, lower back", detail: "5 min", cue: "Longer when you can: target is 30 min twice a week", marge: true, section: "Recovery", video: YT("foam rolling quads glutes lower back tutorial") }

};

const notes = {
  mobility: "Hip flexor tightness is often what's dragging on the lower back. Never skip the couch stretch.",
  mon: "If the knee flares on squats or step-ups, cut the range of motion before cutting the exercise.",
  tue: "Keep the core braced through the pressing and rowing work. That's what protects the lower back.",
  wed: "This is just to stop the round tightening you up before tomorrow's session. Marge's foam rolling target is 30 minutes twice a week, so stretch the last one out when you have time.",
  thu: "Activate the glutes in the warm-up before anything else. It takes load off the back for the whole session.",
  fri: "Warm up properly before the rotational work. That's where the back gets tested most."
};

// Weekday (0 = Sun) to session key, used to mark today's tab.
const weekdayKey = [null, "mon", "tue", "wed", "thu", "fri", null][new Date().getDay()];

const ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_PLAY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const ICON_CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>';
const ICON_LIST = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>';

let activeDay = "mobility";
let checked = {};

// Claude's artifact storage when available, browser storage otherwise.
const store = {
  async get(key) {
    if (window.storage) {
      const res = await window.storage.get(key, false);
      return res ? res.value : null;
    }
    return localStorage.getItem(key);
  },
  async set(key, value) {
    if (window.storage) return window.storage.set(key, value, false);
    localStorage.setItem(key, value);
  }
};

async function loadChecked(dayKey) {
  try {
    const value = await store.get("checked:" + dayKey);
    checked = value ? JSON.parse(value) : {};
  } catch (e) {
    checked = {};
  }
}

async function saveChecked(dayKey) {
  try {
    await store.set("checked:" + dayKey, JSON.stringify(checked));
  } catch (e) {}
}

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  Object.keys(plan).forEach(key => {
    const t = document.createElement("div");
    t.className = "tab" + (key === activeDay ? " active" : "") + (key === weekdayKey ? " today" : "");
    t.innerHTML = '<span class="tab-day">' + plan[key].label + '</span><span class="tab-focus">' + plan[key].focus + '</span>';
    t.onclick = () => switchDay(key);
    tabsEl.appendChild(t);
  });
}

async function switchDay(key) {
  activeDay = key;
  await loadChecked(key);
  renderTabs();
  renderContent();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderContent() {
  const day = plan[activeDay];
  const contentEl = document.getElementById("content");
  const total = day.exercises.length;
  const doneCount = day.exercises.filter(ex => checked[ex.id]).length;
  const pct = Math.round((doneCount / total) * 100);
  const complete = doneCount === total;

  let html = '';
  html += '<section class="summary' + (complete ? ' complete' : '') + '">';
  html += '  <h2 class="session-title">' + day.title + '</h2>';
  html += '  <p class="session-sub">' + day.sub + '</p>';
  html += '  <div class="meta"><span class="chip">' + ICON_CLOCK + day.duration + '</span><span class="chip">' + ICON_LIST + total + ' exercises</span></div>';
  html += '  <div class="progress-row"><span>' + (complete ? '<strong>Session complete</strong>' : '<strong>' + doneCount + '</strong> of ' + total + ' done') + '</span><span>' + pct + '%</span></div>';
  html += '  <div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
  html += '</section>';

  const sections = [];
  day.exercises.forEach(ex => {
    const last = sections[sections.length - 1];
    if (!last || last.name !== ex.section) sections.push({ name: ex.section, items: [ex] });
    else last.items.push(ex);
  });

  sections.forEach(sec => {
    const secDone = sec.items.filter(ex => checked[ex.id]).length;
    html += '<div class="section-head"><span>' + sec.name + '</span><span>' + secDone + '/' + sec.items.length + '</span></div>';
    html += '<div class="list">';
    sec.items.forEach(ex => {
      const isDone = !!checked[ex.id];
      html += '<div class="row' + (isDone ? ' done' : '') + '" data-id="' + ex.id + '" role="checkbox" aria-checked="' + isDone + '">';
      html += '  <div class="check">' + ICON_CHECK + '</div>';
      html += '  <div class="row-body">';
      html += '    <p class="ex-name">' + ex.name + (ex.marge ? '<span class="badge">Marge</span>' : '') + '</p>';
      html += '    <p class="ex-detail">' + ex.detail + '</p>';
      if (ex.cue) html += '    <p class="ex-cue">' + ex.cue + '</p>';
      html += '  </div>';
      html += '  <a class="demo" href="' + ex.video + '" target="_blank" rel="noopener" aria-label="Watch demo">' + ICON_PLAY + '</a>';
      html += '</div>';
    });
    html += '</div>';
  });

  html += '<div class="note"><span class="note-label">Coach note</span>' + notes[activeDay] + '</div>';
  html += '<div class="footer"><span>Tap an exercise to tick it off</span><button id="resetBtn">Reset ticks</button></div>';

  contentEl.innerHTML = html;

  contentEl.querySelectorAll(".row").forEach(el => {
    el.addEventListener("click", async e => {
      if (e.target.closest(".demo")) return;
      const id = el.getAttribute("data-id");
      checked[id] = !checked[id];
      await saveChecked(activeDay);
      renderContent();
    });
  });

  document.getElementById("resetBtn").addEventListener("click", async () => {
    checked = {};
    await saveChecked(activeDay);
    renderContent();
  });
}

(async function init() {
  document.getElementById("today").textContent = new Date().toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" });
  renderTabs();
  await loadChecked(activeDay);
  renderContent();
})();
</script>

</body>
</html>
